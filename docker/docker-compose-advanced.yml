services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      - DB_TYPE=${DB_TYPE}
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_SCHEMA=${DB_POSTGRESDB_SCHEMA}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - NODE_ENV=${NODE_ENV}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      - N8N_RUNNERS_ENABLED=${N8N_RUNNERS_ENABLED}
      - N8N_RUNNERS_MODE=${N8N_RUNNERS_MODE}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=${N8N_RUNNERS_BROKER_LISTEN_ADDRESS}
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_NATIVE_PYTHON_RUNNER=${N8N_NATIVE_PYTHON_RUNNER}
      - N8N_GRAPH_PRIVATE_KEY_PEM=${N8N_GRAPH_PRIVATE_KEY_PEM}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    ports:
      - "5678:5678"
    volumes:
      - /docker/data/n8n-app:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      - postgres

  graph-signer:
    image: node:20-alpine
    container_name: graph-signer
    working_dir: /app
    command: sh -lc "node /app/signer.js"
    environment:
      - GRAPH_PRIVATE_KEY_PEM=${N8N_GRAPH_PRIVATE_KEY_PEM}
    volumes:
      - /docker/data/n8n/signer/signer.js:/app/signer.js:ro
    ports:
      - "127.0.0.1:3003:3003"
    restart: unless-stopped

  task-runners:
    image: n8nio/runners:latest
    container_name: n8n-task-runners
    environment:
      - N8N_RUNNERS_CONFIG_PATH=${N8N_RUNNERS_CONFIG_PATH}
      - N8N_RUNNERS_TASK_BROKER_URI=${N8N_RUNNERS_TASK_BROKER_URI}
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_STDLIB_ALLOW=${N8N_RUNNERS_STDLIB_ALLOW}
    volumes:
      - /docker/data/n8n/runners/n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    restart: unless-stopped
    depends_on:
      - n8n

#N8N backend      
  postgres:
    image: postgres:18
    container_name: postgres_n8nbackend
    ports:
      - "25432"
    environment:
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE}
      POSTGRES_USER: ${DB_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      PGPORT: 25432
    volumes:
      - /docker/data/n8n/postgres:/var/lib/postgresql
    restart: unless-stopped

#N8N DB_1     
  postgres_db1:
    image: postgres:18
    container_name: postgres_db1
    ports:
      - "25433"
    environment:
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE_DB1}
      POSTGRES_USER: ${DB_POSTGRESDB_USER_DB1}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD_DB1}
      PGPORT: 25433
    volumes:
      - /docker/data/n8n/postgres_db1:/var/lib/postgresql
    restart: unless-stopped
    
volumes:
  n8n_data:
    name: n8n_data
